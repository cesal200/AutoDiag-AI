<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoDiag AI{% endblock %}</title>
    <style>
        :root {
            --bg: #0b1220;
            --bg-soft: #111c2f;
            --panel: rgba(15, 23, 42, 0.82);
            --card: #ffffff;
            --primary: #f59e0b;
            --primary-strong: #d97706;
            --secondary: #38bdf8;
            --accent: #1d4ed8;
            --success: #22c55e;
            --warning: #fbbf24;
            --danger: #ef4444;
            --muted: #94a3b8;
            --dark: #0f172a;
            --border: rgba(148, 163, 184, 0.24);
            --shadow: 0 16px 40px rgba(8, 15, 27, 0.28);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(245, 158, 11, 0.22), transparent 18%),
                radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.18), transparent 20%),
                linear-gradient(135deg, #09111d 0%, #0f172a 48%, #111827 100%);
            color: #e2e8f0;
        }

        a { color: inherit; }

        .shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 48px;
        }

        .topbar {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #f8fafc;
        }

        .brand-mark {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #fcd34d);
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.9);
        }

        .brand-sub {
            color: var(--muted);
            font-size: 0.82rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 22px;
        }

        .nav a {
            text-decoration: none;
            color: #dbeafe;
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .nav a:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #111827;
            border-color: transparent;
            transform: translateY(-1px);
        }

        main { margin-top: 28px; }

        .hero, .card, .panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow);
        }

        .hero {
            padding: 28px 30px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .eyebrow::before {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.9);
        }

        h1, h2, h3 { margin: 0 0 14px; color: #f8fafc; }
        h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.1; }
        h2 { font-size: 1.5rem; }

        .subtitle {
            color: var(--muted);
            line-height: 1.7;
            margin: 0;
            font-size: 1.02rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.22);
            border-radius: 999px;
            font-weight: 700;
            padding: 8px 14px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-top: 26px;
        }

        .metric {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 20px;
        }

        .metric span {
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .metric strong {
            display: block;
            font-size: 2rem;
            color: #f8fafc;
            margin-top: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card, .panel { padding: 22px 24px; }

        .card ul, .panel ul {
            margin: 16px 0 0;
            padding-left: 18px;
            line-height: 1.9;
            color: var(--muted);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            color: #e2e8f0;
        }

        .table th, .table td {
            text-align: left;
            border-bottom: 1px solid var(--border);
            padding: 12px 10px;
        }

        .table th {
            color: var(--muted);
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            background: rgba(59, 130, 246, 0.15);
            color: #bfdbfe;
        }

        .status.warning { background: rgba(251, 191, 36, 0.14); color: #fde68a; }
        .status.danger { background: rgba(239, 68, 68, 0.14); color: #fecaca; }

        form { display: grid; gap: 16px; }

        .field { display: grid; gap: 8px; }
        .field label { font-weight: 700; color: #e2e8f0; }
        .field input, .field select, .field textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            font: inherit;
            background: rgba(15, 23, 42, 0.65);
            color: #f8fafc;
        }
        .field input::placeholder, .field textarea::placeholder { color: #94a3b8; }
        .field textarea { min-height: 120px; resize: vertical; }

        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #111827;
            box-shadow: 0 12px 22px rgba(245, 158, 11, 0.25);
        }

        .btn.secondary {
            background: rgba(56, 189, 248, 0.12);
            color: #dbeafe;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .result {
            padding: 18px 20px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: #cbd5e1;
        }

        footer {
            margin-top: 34px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 760px) {
            .hero, .grid, .metrics { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark"></span>
                <span>AutoDiag AI</span>
            </div>
            <div class="brand-sub">Taller mecánico · diagnóstico inteligente</div>
        </header>

        <nav class="nav">
            <a href="/">Inicio</a>
            <a href="/workshop/orden/nueva/">Nueva orden</a>
            <a href="/workshop/orden/lista/">Órdenes</a>
            <a href="/api/diagnostico/analizar/101/">Diagnóstico</a>
            <a href="/api/distribucion/configurar/101/">Distribución</a>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            © 2026 AutoDiag AI · Sistema de taller mecánico con IA
        </footer>
    </div>
</body>
</html>
